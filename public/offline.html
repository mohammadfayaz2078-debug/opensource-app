<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#007c89">
    <title>BazarNet - Offline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            color: #1e293b;
            padding: 1.5rem;
        }
        .container { text-align: center; max-width: 320px; }
        .logo {
            width: 80px; height: 80px; margin: 0 auto 1.5rem;
            background: #007c89; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
        }
        .logo span { color: white; font-weight: bold; font-size: 2rem; }
        h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
        p { font-size: 0.875rem; color: #64748b; margin-bottom: 1.5rem; line-height: 1.5; }
        button {
            padding: 0.625rem 1.5rem; border: none; border-radius: 0.5rem;
            background: #007c89; color: white; font-size: 0.875rem;
            font-weight: 500; cursor: pointer; transition: background 0.2s;
        }
        button:hover { background: #006d77; }
        .icon { width: 2rem; height: 2rem; margin: 0 auto 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"><span>BN</span></div>
        <h1>You&apos;re offline</h1>
        <p>Please check your internet connection and try again. Some cached content may still be available.</p>
        <button onclick="window.location.reload()">Retry</button>
    </div>
</body>
</html>
